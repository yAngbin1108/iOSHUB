name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Package unsigned IPA (Release, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure project is readable (fallback to XcodeGen)
        run: |
          if xcodebuild -list -project iOSHUB.xcodeproj > /dev/null 2>&1; then
            echo "OK pbxproj readable"
          else
            echo "WARN regenerating with XcodeGen"
            brew install xcodegen
            xcodegen generate --spec project.yml
          fi

      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project iOSHUB.xcodeproj \
            -scheme iOSHUB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log

      - name: Package Payload into .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/iOSHUB.app"
          test -d "$APP_PATH"
          rm -rf Payload iOSHUB-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry iOSHUB-unsigned.ipa Payload
          ls -lh iOSHUB-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSHUB-unsigned-ipa
          path: iOSHUB-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-device.log
          if-no-files-found: ignore
